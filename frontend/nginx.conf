# nginx config for IncidentVault frontend.
# - Serves the Vite SPA build from /usr/share/nginx/html
# - Proxies /api/ to the Spring Boot backend service named `backend`
# - Falls back to index.html for client-side routes (react-router)

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API reverse proxy — compose service name is `backend`
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static assets: cache aggressively, they carry content hashes
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — every non-API, non-file path serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
